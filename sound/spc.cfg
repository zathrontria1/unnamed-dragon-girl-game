# ca65 linker config for SPC file (Super NES music)

# Physical areas of memory
MEMORY {
  SPCZEROPAGE: start=$0000, size=$00F0;
  SPCSTACKRAM: start=$0100, size=$00C0;
  SPCDIR:      start=$0200, size=$0100;
  SPCRAM:      start=$0300, size=$FD00;
}

# Logical areas code/data can be put into.
SEGMENTS {
    SPCZEROPAGE: load = SPCZEROPAGE, type=zp;
    SPCSTACKRAM: load = SPCSTACKRAM, type=bss, optional=yes;
    SPCDIR:      load = SPCDIR,      type=bss;
    SPCIMAGE:    load = SPCRAM,      align = $100;
    SPCBSS:      load = SPCRAM,      type = bss, optional=yes;
}
